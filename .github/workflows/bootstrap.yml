
name: Bootstrap ERPAY Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project and build APK
        run: |
          chmod +x setup.sh
          bash setup.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.gradle build.gradle gradle.properties app .github/workflows/build-apk.yml
          git commit -m "Generate ERPAY Android project" || true
          git push
          
